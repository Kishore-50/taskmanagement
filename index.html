<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container mt-5">
    <h1 class="text-center">Task Manager</h1>

    <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>
    <div id="successMessage" class="alert alert-success d-none" role="alert"></div>

    <div class="input-group mb-3">
      <input id="taskInput" type="text" class="form-control"
        placeholder="Enter task title" aria-label="Task title">
      <button id="addTaskButton" class="btn btn-primary" type="button">Add Task</button>
    </div>

    <div class="row" id="taskColumns">
      <div class="col-md-4">
        <div class="card mb-4">
          <div class="card-header"><h5 class="mb-0">Pending Tasks</h5></div>
          <div class="card-body" id="pendingTasks"></div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card mb-4">
          <div class="card-header"><h5 class="mb-0">Ongoing Tasks</h5></div>
          <div class="card-body" id="ongoingTasks"></div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card mb-4">
          <div class="card-header"><h5 class="mb-0">Completed Tasks</h5></div>
          <div class="card-body" id="completedTasks"></div>
        </div>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
